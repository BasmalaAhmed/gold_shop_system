name: gold_shop_app
description: "نظام إدارة ومبيعات محلات الذهب - تطبيق موحد متكامل"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  sqflite: ^2.4.6
  path: ^1.9.1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  timezone: ^0.11.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6
  mobile_scanner: ^7.5.0
  intl: ^0.20.2
  app_links: ^7.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences_platform_interface: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/static/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/static/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/static/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/static/Cairo-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBM Plex Sans Arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM Plex Sans Arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM Plex Sans Arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM Plex Sans Arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
